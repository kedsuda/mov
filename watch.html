<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>กำลังเล่น — LUMIÈRE</title>
  <meta name="theme-color" content="#08080a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f6e7b0'/%3E%3Cstop offset='1' stop-color='%23a8842a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2308080a'/%3E%3Cpath d='M22 16v32l26-16z' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="watch-page">
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar scrolled">
    <a class="brand" href="./" aria-label="LUMIÈRE หน้าแรก">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">LUMIÈRE</span>
    </a>
    <div class="top-actions">
      <a class="btn btn-ghost btn-sm" href="./">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>กลับหน้าหลัก
      </a>
    </div>
  </header>

  <main class="watch">
    <div class="player-wrap">
      <div class="player" id="player" data-state="loading">
        <div class="player-msg" id="playerMsg">
          <div class="spinner"></div>
          <p>กำลังเตรียมภาพยนตร์…</p>
        </div>
      </div>
    </div>

    <section class="watch-info" id="watchInfo" aria-live="polite">
      <div class="skeleton sk-line" style="width:160px"></div>
      <div class="skeleton sk-title"></div>
      <div class="skeleton sk-line" style="width:70%"></div>
    </section>

    <section class="row" id="moreRow" hidden>
      <header class="row-head">
        <div>
          <span class="kicker">Keep Watching</span>
          <h2>ดูต่อ · ฟรีและถูกลิขสิทธิ์</h2>
        </div>
      </header>
      <div class="track" id="moreTrack"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">LUMIÈRE</span></div>
    <p>วิดีโอบนหน้านี้มาจากแหล่งที่เป็นสาธารณสมบัติหรือเผยแพร่ภายใต้สัญญาอนุญาตแบบเปิด เช่น <a href="https://archive.org/" target="_blank" rel="noopener">Internet Archive</a> และ <a href="https://studio.blender.org/films/" target="_blank" rel="noopener">Blender Studio</a></p>
    <p class="fine">เว็บไซต์นี้ไม่โฮสต์หรือเผยแพร่ภาพยนตร์ละเมิดลิขสิทธิ์</p>
  </footer>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/providers.js"></script>
  <script src="assets/js/watch.js"></script>
</body>
</html>
